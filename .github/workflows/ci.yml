name: ci

on:
  push:
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/frontend/package-lock.json"

      - name: Build frontend (Vite)
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Copy dist into wheel package
        run: |
          rm -rf web/frontend_dist/dist
          mkdir -p web/frontend_dist/dist
          cp -R web/frontend/dist/. web/frontend_dist/dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install -U pip
          # Pre-install docs2md: its pyproject.toml uses `license = "MIT"` (bare
          # string) and `license-files` which setuptools>=69.5 rejects (PEP 639).
          git clone --depth 1 https://github.com/Grant-Huang/docs2md.git /tmp/docs2md
          sed -i 's/^license = "MIT"/license = {text = "MIT"}/' /tmp/docs2md/pyproject.toml
          sed -i '/^license-files/d' /tmp/docs2md/pyproject.toml
          python -m pip install /tmp/docs2md
          # Pre-install epic-doc from its git URL (correct metadata, installs fine).
          python -m pip install "epic-doc @ git+https://github.com/Grant-Huang/epic-doc.git"
          # Strip both git+https URLs from pyproject.toml so pip reuses the
          # already-installed copies without re-fetching or re-validating.
          sed -i 's|docs2md @ git+https://github.com/Grant-Huang/docs2md.git|docs2md|' pyproject.toml
          sed -i 's|epic-doc @ git+https://github.com/Grant-Huang/epic-doc.git|epic-doc|' pyproject.toml
          python -m pip install -e ".[test]"

      - name: Test
        run: |
          python -m pytest

      - name: Build wheel
        run: |
          python -m pip install -U build
          python -m build

