name: ci

on:
  push:
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/frontend/package-lock.json"

      - name: Build frontend (Vite)
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Copy dist into wheel package
        run: |
          rm -rf web/frontend_dist/dist
          mkdir -p web/frontend_dist/dist
          cp -R web/frontend/dist/. web/frontend_dist/dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install -U pip
          # Install PyPI deps and test dep explicitly; skip git-URL deps (docs2md,
          # epic-doc) because they are invoked as CLI subprocesses and never imported
          # directly, so they are not needed for the test suite to run.
          python -m pip install \
            "fastapi>=0.115.0" \
            "python-multipart>=0.0.9" \
            "uvicorn[standard]>=0.32.0" \
            "markitdown[xlsx]>=0.1.0" \
            "httpx>=0.27.0"
          # Install our package without resolving git-URL deps (already satisfied above).
          python -m pip install -e . --no-deps

      - name: Test
        run: |
          python -m pytest

      - name: Build wheel
        run: |
          python -m pip install -U build
          # python -m build only needs to produce wheel metadata; it does not install
          # runtime deps, so git-URL entries in pyproject.toml are fine as-is.
          python -m build

