name: ci

on:
  push:
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/frontend/package-lock.json"

      - name: Build frontend (Vite)
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Copy dist into wheel package
        run: |
          rm -rf web/frontend_dist/dist
          mkdir -p web/frontend_dist/dist
          cp -R web/frontend/dist/. web/frontend_dist/dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install -U pip
          # Install only what is actually imported at test time.
          # - uvicorn is not needed: tests use TestClient (ASGI in-process, no server).
          # - markitdown is not needed: only referenced in subprocess hint strings.
          # - git-URL deps (docs2md, epic-doc) are CLI subprocesses, never imported.
          # The package itself is not installed — pytest pythonpath covers src/web.
          python -m pip install \
            pytest \
            "fastapi>=0.115.0" \
            "python-multipart>=0.0.9" \
            "httpx>=0.27.0"

      - name: Test
        run: |
          python -m pytest

      - name: Build wheel
        run: |
          python -m pip install -U build
          # --wheel skips the sdist→wheel double-isolation step.
          # git-URL entries in pyproject.toml are recorded as metadata only.
          python -m build --wheel

