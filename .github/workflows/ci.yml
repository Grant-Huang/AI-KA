name: ci

on:
  push:
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/frontend/package-lock.json"

      - name: Build frontend (Vite)
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Copy dist into wheel package
        run: |
          rm -rf web/frontend_dist/dist
          mkdir -p web/frontend_dist/dist
          cp -R web/frontend/dist/. web/frontend_dist/dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install -U pip
          # docs2md pyproject.toml uses bare `license = "MIT"` and `license-files`
          # which are rejected by modern setuptools. Clone, patch, and install first.
          git clone --depth 1 https://github.com/Grant-Huang/docs2md.git /tmp/docs2md
          sed -i 's/^license = "MIT"/license = {text = "MIT"}/' /tmp/docs2md/pyproject.toml
          sed -i '/^license-files/d' /tmp/docs2md/pyproject.toml
          python -m pip install /tmp/docs2md
          # Replace the git+https URL in pyproject.toml with a bare name so pip
          # reuses the installed copy instead of re-fetching and re-validating it.
          sed -i 's|docs2md @ git+https://github.com/Grant-Huang/docs2md.git|docs2md|' pyproject.toml
          # No --no-build-isolation: epic-doc uses hatchling which needs its own
          # isolated build env; docs2md is already installed so pip reuses it.
          python -m pip install -e .

      - name: Test
        run: |
          python -m pytest

      - name: Build wheel
        run: |
          python -m pip install -U build
          python -m build

