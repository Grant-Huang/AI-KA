name: ci

on:
  push:
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/frontend/package-lock.json"

      - name: Build frontend (Vite)
        working-directory: web/frontend
        run: |
          npm ci
          npm run build

      - name: Copy dist into wheel package
        run: |
          rm -rf web/frontend_dist/dist
          mkdir -p web/frontend_dist/dist
          cp -R web/frontend/dist/. web/frontend_dist/dist/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install -U pip
          # docs2md has a broken pyproject.toml (bare license string + license-files)
          # that setuptools>=69.5 rejects. Clone, patch, and install before anything else.
          git clone --depth 1 https://github.com/Grant-Huang/docs2md.git /tmp/docs2md
          sed -i 's/^license = "MIT"/license = {text = "MIT"}/' /tmp/docs2md/pyproject.toml
          sed -i '/^license-files/d' /tmp/docs2md/pyproject.toml
          python -m pip install /tmp/docs2md
          # epic-doc has correct metadata; install it directly from git.
          python -m pip install "epic-doc @ git+https://github.com/Grant-Huang/epic-doc.git"
          # Install all remaining PyPI deps and test dep explicitly.
          python -m pip install \
            "fastapi>=0.115.0" \
            "python-multipart>=0.0.9" \
            "uvicorn[standard]>=0.32.0" \
            "markitdown[xlsx]>=0.1.0" \
            "httpx>=0.27.0"
          # Install our package without re-resolving deps (all already installed above).
          python -m pip install -e . --no-deps

      - name: Test
        run: |
          python -m pytest

      - name: Build wheel
        run: |
          python -m pip install -U build
          # python -m build creates an isolated env; docs2md bare name avoids
          # the broken git URL being fetched there too.
          sed -i 's|docs2md @ git+https://github.com/Grant-Huang/docs2md.git|docs2md|' pyproject.toml
          python -m build

