services:
  ai-ka:
    build: .
    image: ai-ka:latest
    ports:
      - "8765:8765"
    environment:
      # 必须：仓库根（SQLite、.tmp、review_skill_packages 等路径）
      AIKA_REPO_ROOT: /app
      # 浏览器从宿主机访问时的来源（按需增删）
      AIKA_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8765,http://127.0.0.1:8765"
      # 可选：审查技能包根目录（默认 $AIKA_REPO_ROOT/review_skill_packages）
      # AIKA_REVIEW_SKILL_PACKAGES_ROOT: "/app/review_skill_packages"
      # 可选：LLM（也可在容器外通过 app_settings.md 配置，需挂载卷）
      # AIKA_LLM_BASE_URL: ""
      # AIKA_LLM_API_KEY: ""
      # AIKA_LLM_PROVIDER: "openai_compatible"
    volumes:
      # 持久化：项目索引、转换产物、SQLite
      - ai-ka-data:/app/.tmp
      # 可选：挂载审查技能包与应用设置
      # - ./review_skill_packages:/app/review_skill_packages
      # - ./app_settings.md:/app/app_settings.md
    restart: unless-stopped

volumes:
  ai-ka-data:
